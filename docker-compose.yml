services:

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: a2faas-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./database:/app/database

  frontend:
    image: node:22-alpine
    container_name: a2faas-frontend
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend